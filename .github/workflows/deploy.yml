name: Build and deploy

on:
  push:
    branches: [main]
  # Rebuild daily in the evening to pick up fresh Clusterflick data. Late rather
  # than midday because cinema chains publish the coming week's schedule in bulk
  # during the day: a midday build caught the "before" state and listings for
  # days 3+ out came in ~30% short (see clipProvisional in src/history.js). A
  # late build also puts the finalized/provisional boundary after the 20:00 peak
  # rather than in the small hours.
  # GitHub cron is UTC (no DST): 21:00 UTC = 21:00 London in winter (GMT),
  # ~22:00 in summer (BST).
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

# GitHub Pages: queue deploys rather than cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

# Deny all by default; each job grants only the scopes it needs.
permissions: {}

jobs:
  # Close whatever the newest upstream releases have now superseded, and commit
  # it: performance-history windows, and venue-health day aggregates. Both are
  # write-once — a window is a pure function of one release, a day aggregate of
  # one finished London day — so this only ever adds files.
  #
  # Both live in one job because both push to the same branch, and two jobs
  # racing to do that would just conflict. Unlike every other job here it needs
  # write access and therefore keeps its checkout credentials; pushes made with
  # github.token deliberately do NOT trigger another workflow run, so this
  # cannot loop.
  data:
    name: Update committed data
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      # neither history.mjs nor health.mjs has dependencies, so no npm ci here
      - name: Finalize newly-closed history windows
        run: npm run history:update
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Aggregates every day up to yesterday that has no file yet, so a run that
      # failed — or a day clusterflick/data-analysed never published — is picked
      # up by the next run rather than being lost. No token: a health release's
      # asset URL is derived from its date, so nothing here touches the API.
      - name: Aggregate finished venue-health days
        run: npm run health:days
      - name: Commit new data
        run: |
          if [ -z "$(git status --porcelain data-history data-health)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-history data-health
          git commit -m "Update performance history and venue health data"
          git push

  build:
    name: Build site
    needs: data
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # take the branch tip rather than the triggering SHA, so this picks up
          # the windows and day aggregates the data job just committed
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # Pinned to the release the history job indexed, NOT to whatever is newest
      # now. Releases land a few times a day; one arriving between that job and
      # this step would leave the hours between the last closed window and the new
      # release in no window and absent from the new release too (releases carry
      # only FUTURE performances), so they would vanish from the daily totals.
      # Pinning makes the two agree by construction rather than by timing.
      - name: Download Clusterflick combined data
        run: ./scripts/get-latest-combined-data.sh "$(node history.mjs latest-tag)"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build compact data blob
        run: npm run transform
      - name: Build performance history blob
        run: npm run history:build
      # Merges the committed day aggregates with today's still-open health log,
      # which it fetches itself — the job that writes day files is a different
      # checkout, so today's cannot be handed over from there.
      - name: Build venue health blob
        run: npm run health:build
      - name: Build site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    permissions: {}
    needs: deploy
    steps:
      - name: Submit home page to IndexNow
        env:
          INDEXNOW_KEY: 7e376ae76b808d7a3c3a957018d7da41
        run: |
          # Nudge IndexNow (Bing, Yandex, ...) to recrawl. The site is a single
          # page whose data changes on each daily rebuild, so we submit the home
          # URL. First wait for the deployed key file so validation succeeds.
          for i in $(seq 1 20); do
            if curl -sf "https://everycinema.london/${INDEXNOW_KEY}.txt" >/dev/null; then
              echo "Key file live."; break
            fi
            echo "Attempt $i/20: key file not live yet..."; sleep 10
          done
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d @- <<JSON
          {
            "host": "everycinema.london",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://everycinema.london/${INDEXNOW_KEY}.txt",
            "urlList": [
              "https://everycinema.london/"
            ]
          }
          JSON
          )
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "IndexNow response ($STATUS): ${BODY:-<empty>}"
          case "$STATUS" in
            200|202) echo "IndexNow submission accepted." ;;
            *) echo "IndexNow submission failed with status $STATUS"; exit 1 ;;
          esac