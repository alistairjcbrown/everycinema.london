name: Build and deploy

on:
  push:
    branches: [main]
  # Rebuild daily around midday to pick up fresh Clusterflick data.
  # GitHub cron is UTC (no DST): 12:00 UTC = 12:00 London in winter (GMT),
  # ~13:00 in summer (BST).
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

# GitHub Pages: queue deploys rather than cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

# Deny all by default; each job grants only the scopes it needs.
permissions: {}

jobs:
  # Close any performance-history windows that the newest releases have now
  # superseded, and commit them. Windows are write-once, so this only ever adds
  # files. Unlike every other job here this one needs write access and therefore
  # keeps its checkout credentials — pushes made with github.token deliberately
  # do NOT trigger another workflow run, so this cannot loop.
  history:
    name: Update performance history
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      # history.mjs has no dependencies, so no npm ci needed here
      - name: Finalize newly-closed windows
        run: npm run history:update
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit new windows
        run: |
          if [ -z "$(git status --porcelain data-history)" ]; then
            echo "No history changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-history
          git commit -m "Update performance history windows"
          git push

  build:
    name: Build site
    needs: history
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # take the branch tip rather than the triggering SHA, so this picks up
          # the windows the history job just committed
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Download Clusterflick combined data
        run: ./scripts/get-latest-combined-data.sh
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Build compact data blob
        run: npm run transform
      - name: Build performance history blob
        run: npm run history:build
      - name: Build site
        run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  indexnow:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    permissions: {}
    needs: deploy
    steps:
      - name: Submit home page to IndexNow
        env:
          INDEXNOW_KEY: 7e376ae76b808d7a3c3a957018d7da41
        run: |
          # Nudge IndexNow (Bing, Yandex, ...) to recrawl. The site is a single
          # page whose data changes on each daily rebuild, so we submit the home
          # URL. First wait for the deployed key file so validation succeeds.
          for i in $(seq 1 20); do
            if curl -sf "https://everycinema.london/${INDEXNOW_KEY}.txt" >/dev/null; then
              echo "Key file live."; break
            fi
            echo "Attempt $i/20: key file not live yet..."; sleep 10
          done
          RESPONSE=$(curl -sS -w '\n%{http_code}' -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d @- <<JSON
          {
            "host": "everycinema.london",
            "key": "${INDEXNOW_KEY}",
            "keyLocation": "https://everycinema.london/${INDEXNOW_KEY}.txt",
            "urlList": [
              "https://everycinema.london/"
            ]
          }
          JSON
          )
          STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "IndexNow response ($STATUS): ${BODY:-<empty>}"
          case "$STATUS" in
            200|202) echo "IndexNow submission accepted." ;;
            *) echo "IndexNow submission failed with status $STATUS"; exit 1 ;;
          esac